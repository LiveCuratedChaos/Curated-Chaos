name: App checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Tests and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify repository read access
        env:
          CC_CHECK_TOKEN: ${{ github.token }}
          CC_CHECK_REPOSITORY: ${{ github.repository }}
          CC_CHECK_SHA: ${{ github.sha }}
        run: |
          cc_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CC_CHECK_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${CC_CHECK_REPOSITORY}/contents/package.json?ref=${CC_CHECK_SHA}")
          printf 'Repository contents API HTTP status: %s\n' "$cc_status"
          test "$cc_status" = 200
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install launcher syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - run: npm run check:offline
      - name: Diagnose fictional test failures
        if: failure()
        run: npm test
  browser:
    name: Browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify repository read access
        env:
          CC_CHECK_TOKEN: ${{ github.token }}
          CC_CHECK_REPOSITORY: ${{ github.repository }}
          CC_CHECK_SHA: ${{ github.sha }}
        run: |
          cc_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CC_CHECK_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${CC_CHECK_REPOSITORY}/contents/package.json?ref=${CC_CHECK_SHA}")
          printf 'Repository contents API HTTP status: %s\n' "$cc_status"
          test "$cc_status" = 200
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
  mac-native:
    name: Mac Calendar native checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Verify repository read access
        env:
          CC_CHECK_TOKEN: ${{ github.token }}
          CC_CHECK_REPOSITORY: ${{ github.repository }}
          CC_CHECK_SHA: ${{ github.sha }}
        run: |
          cc_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CC_CHECK_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${CC_CHECK_REPOSITORY}/contents/package.json?ref=${CC_CHECK_SHA}")
          printf 'Repository contents API HTTP status: %s\n' "$cc_status"
          test "$cc_status" = 200
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --test tests/mac-calendar-native-transfer.test.mjs
